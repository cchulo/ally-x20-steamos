# SPDX-License-Identifier: GPL-2.0-only
# ally-x20-steamos: load our two WirePlumber 0.5 hooks (the file name is
# historical):
#   x20-route-by-channels.lua    links the headphone surround outputs
#                                (x20-virtual-surround-71/51.output) to an
#                                available headphone sink
#   x20-select-default-sink.lua  automatic default sink: the X20 speaker DSP
#                                on the speakers, x20-virtual-surround-71 on
#                                any headphones
# Application streams are not routed: they follow the default sink.
#
# Installed into ~/.config/wireplumber/wireplumber.conf.d/ by the audio_dsp
# component. `ally-x20-steamos audio-dsp off` removes this fragment.
#
# Fragments merge into wireplumber.conf: arrays are appended, objects merged.

wireplumber.components = [
  # The hook scripts. Names are resolved under
  # $XDG_DATA_HOME/wireplumber/scripts (~/.local/share/wireplumber/scripts);
  # both require lib/x20-route-core.lua and lib/x20-sink-facts.lua from the
  # same tree.
  {
    name = x20-route-by-channels.lua, type = script/lua
    provides = custom.x20-route-by-channels
    # find-default-target needs the same API (default sink lookup).
    requires = [ api.default-nodes ]
  }
  {
    name = x20-select-default-sink.lua, type = script/lua
    provides = custom.x20-select-default-sink
  }
  # Indirection so a broken or missing script can never stop WirePlumber:
  # this virtual feature is required by the profile, but it only *wants* the
  # script. A wanted component that fails to load is logged and skipped,
  # whereas a required one would fail the whole profile (no audio at all).
  {
    type = virtual, provides = custom.x20-audio-dsp
    wants = [ custom.x20-route-by-channels, custom.x20-select-default-sink ]
  }
]

wireplumber.profiles = {
  # "main" is the profile the wireplumber.service user unit runs.
  # TODO(hw): confirm SteamOS does not start WirePlumber with another profile.
  main = {
    custom.x20-audio-dsp = required
  }
}

wireplumber.settings.schema = {
  # Read by x20-select-default-sink.lua; persisted by `ally-x20-steamos
  # audio-dsp <command> on|off` in 51-x20-settings.conf next to this file,
  # changed at runtime with `wpctl settings x20.<key> true|false`.
  x20.speakers_precedence = {
    name = "X20: speaker DSP as the automatic default"
    description = "Automatic default on the built-in speakers is x20-speakers (or x20-speakers-surround) instead of the bare hardware sink (audio-dsp speakers-precedence)"
    type = "bool"
    default = true
  }
  x20.headphones_virtual_surround = {
    name = "X20: virtual surround as the automatic default on headphones"
    description = "Automatic default on headphones (jack, USB, Bluetooth) is x20-virtual-surround-71 instead of the bare headphone sink (audio-dsp headphones-virtual-surround)"
    type = "bool"
    default = true
  }
  # stereo_hrtf and speaker_surround are kept so old 51-x20-settings.conf
  # files and scripts stay valid; nothing reads them.
  x20.stereo_hrtf = {
    name = "X20: stereo through HRTF (no effect)"
    description = "Former per-stream routing switch; pick an X20 headphone surround sink in Steam instead"
    type = "bool"
    default = false
  }
  x20.speaker_surround = {
    name = "X20: speaker virtual surround (no effect)"
    description = "Former per-stream routing switch; pick X20 Speakers (virtual surround) in Steam instead"
    type = "bool"
    default = true
  }
  x20.stereo_surround = {
    name = "X20: speaker virtual surround is the automatic default"
    description = "Automatic default on the built-in speakers is x20-speakers-surround instead of x20-speakers (audio-dsp stereo-surround, which also sets their priorities)"
    type = "bool"
    default = false
  }
}
