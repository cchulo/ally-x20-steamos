# ally-x20-steamos (component: hdr). gamescope-session runs `exec gamescope`
# through PATH, so putting our bin dir first selects the wrapper, which runs
# our gamescope build only when it accepts every session flag and otherwise
# execs stock gamescope. Delete this file to return to stock. See docs/hdr.md.
# Environment= does not expand $PATH: the rest is systemd's default user PATH.
# TODO(vm): confirm against `systemctl --user show-environment` on SteamOS.
[Service]
Environment=PATH=/var/lib/ally-x20-steamos/bin:/usr/local/sbin:/usr/local/bin:/usr/bin
