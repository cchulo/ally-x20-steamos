# ally-x20-steamos FALLBACK ONLY: run an upstream InputPlumber built by
# build/build-inputplumber.sh instead of the stock daemon. Installed only when
# AX20_INPUTPLUMBER_FALLBACK=1 or the stock daemon is older than the profile
# needs (see docs/inputplumber.md). @AX20_INPUTPLUMBER_OPT@ is replaced at
# apply time. Removing this drop-in (uninstall) restores the stock daemon.
#
# Stock unit (upstream rootfs/usr/lib/systemd/system/inputplumber.service,
# identical in the SteamOS 0.78.0 package): ExecStart=/usr/bin/inputplumber,
# no arguments, Type=dbus, BusName=org.shadowblip.InputPlumber.
[Service]
# Data files (devices/, capability_maps/, schema/) matching the built binary;
# the daemon picks the first XDG data dir that has an "inputplumber" folder.
# /etc/inputplumber/devices.d and capability_maps.d are still read.
Environment=XDG_DATA_DIRS=@AX20_INPUTPLUMBER_OPT@/share
ExecStart=
ExecStart=@AX20_INPUTPLUMBER_OPT@/bin/inputplumber
