# ally-x20-steamos, tools/surround-test: HRTF (SOFA) sets for the blind test.
#
# Same format as the lock file of the removed audio_dsp component
# (899ba9b:overlay/home/hrtf/hrtf.lock). The .sofa files are never committed;
# fetch-sofa.sh downloads them and verifies the SHA-256 below. The licence of
# every set was read from the file's own `License` attribute on 2026-11-18.
#
# Line formats (whitespace separated, one record per line):
#   set <name> <sha256> <size-bytes> <license> <url>
#   attribution <name> <free text...>

