name: test
# Linux only: macOS runners cost 10x per minute and the target (SteamOS) runs
# bash 5. bash 3.2 compatibility is checked by developers locally (make check).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck shfmt jq python3-pytest zstd
      - name: Lint
        run: make lint
      - name: Unit tests (bats + pytest)
        run: make test
