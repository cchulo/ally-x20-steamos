# SPDX-License-Identifier: GPL-2.0-only
# ally-x20-steamos: headphone virtual surround (X20-STEAMOS-PLAN.md section 1.5).
#
# Installed by the audio_dsp component into
#   ~/.config/pipewire/pipewire.conf.d/50-x20-virtual-surround.conf
# In the repository copy every sofa "filename" is a placeholder token that the
# component replaces at install time with the absolute path of
# ~/.config/ally-x20-steamos/hrtf/current.sofa: the sofa plugin hands the
# file name straight to libmysofa, which does not expand "~". current.sofa is a
# symlink to one of the downloaded HRTF sets, so switching sets is a relink
# plus a PipeWire restart (`ally-x20-steamos audio-dsp hrtf <name>`).
#
# Two sinks rather than one 7.1 sink with a layout switch:
#   - 5.1 and 7.1 put the surround speakers in different places (ITU-R
#     BS.775: surrounds at +-110 deg; 7.1: sides at +-90, rears at +-150).
#     Feeding 5.1 into a 7.1 renderer would put its surrounds at the 7.1 rear
#     or side angles, which is not where the mix was made for.
#   - The HRTF angles are filter controls shared by every stream on the sink.
#     A runtime switch would re-render a 7.1 game whenever a 5.1 video starts.
#   - An idle sink (no stream linked) does not process audio, so the second
#     sink costs memory for the loaded HRTF only (shared via
#     mysofa_open_cached), not CPU.
# The WirePlumber script x20-route-by-channels.lua decides per stream:
# 3..6 channels -> x20-virtual-surround-51, 7..8 -> x20-virtual-surround-71.
#
# Visibility: media.class Audio/Sink/Internal keeps both sinks out of every
# pulse-based picker (KDE, Steam Game Mode, pavucontrol): on the X20 Steam
# listed them next to "Speakers" and picking one sent binaural audio to the
# speakers. They are routing targets only; the WirePlumber router picks them
# per stream, and `audio-dsp stereo-hrtf on` is the knob for stereo through
# the HRTF (docs/audio-dsp.md, "Device pickers").
#
# Requirements: PipeWire built with the sofa plugin (libmysofa). SteamOS 3.9
# ships it as /usr/lib/spa-0.2/filter-graph/libspa-filter-graph-plugin-sofa.so
# (pipewire-audio 1.6.x, depends on libmysofa). TODO(hw): confirm on the X20.
#
# Angles: the sofa plugin measures azimuth counter-clockwise from straight
# ahead (0 = front, 90 = left, 180 = behind, 270 = right). Elevation 0 for
# all speakers. Radius 1 m: the bundled sets were measured at 1-1.5 m and
# libmysofa picks the nearest measured direction.
# LFE has no direction, so it is not spatialised: a copy node feeds it to both
# ears at -6 dB (no HRIR delay; at < 120 Hz a ~1 ms offset is inaudible).

context.modules = [
    # ---------------------------------------------------------------- 71 --
    # 7.1 layout (ITU-R BS.2051 / Dolby 7.1): FL/FR +-30, FC 0, SL/SR +-90,
    # RL/RR +-150 (the 135..150 deg recommendation, far end for a clearer rear image).
    { name = libpipewire-module-filter-chain
        # nofail: a missing HRTF file or sofa plugin must not stop PipeWire;
        # the sink is simply absent and the router falls back to the
        # hardware sink.
        flags = [ nofail ]
        args = {
            node.description = "X20 headphone surround 7.1 (headphones only)"
            media.name       = "X20 headphone surround 7.1 (headphones only)"
            filter.graph = {
                nodes = [
                    # FL at azimuth 30 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spFL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 30.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # FR at azimuth 330 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spFR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 330.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # FC at azimuth 0 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spFC
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 0.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # LFE carries no direction: it bypasses the HRTF and is
                    # fed to both ears (see the mixer gains below).
                    { type = builtin label = copy name = cpLFE }
                    # RL at azimuth 150 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spRL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 150.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # RR at azimuth 210 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spRR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 210.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # SL at azimuth 90 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spSL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 90.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # SR at azimuth 270 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spSR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 270.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # Sum every rendered source into the left and right ear.
                    # The builtin mixer has 8 inputs; In N follows the order
                    # of the links below. LFE (last input) at -6 dB.
                    { type = builtin label = mixer name = mixL
                        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 1.0 "Gain 7" = 1.0 "Gain 8" = 0.5 } }
                    { type = builtin label = mixer name = mixR
                        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 1.0 "Gain 7" = 1.0 "Gain 8" = 0.5 } }
                ]
                links = [
                    { output = "spFL:Out L" input = "mixL:In 1" }
                    { output = "spFL:Out R" input = "mixR:In 1" }
                    { output = "spFR:Out L" input = "mixL:In 2" }
                    { output = "spFR:Out R" input = "mixR:In 2" }
                    { output = "spFC:Out L" input = "mixL:In 3" }
                    { output = "spFC:Out R" input = "mixR:In 3" }
                    { output = "spRL:Out L" input = "mixL:In 4" }
                    { output = "spRL:Out R" input = "mixR:In 4" }
                    { output = "spRR:Out L" input = "mixL:In 5" }
                    { output = "spRR:Out R" input = "mixR:In 5" }
                    { output = "spSL:Out L" input = "mixL:In 6" }
                    { output = "spSL:Out R" input = "mixR:In 6" }
                    { output = "spSR:Out L" input = "mixL:In 7" }
                    { output = "spSR:Out R" input = "mixR:In 7" }
                    { output = "cpLFE:Out"  input = "mixL:In 8" }
                    { output = "cpLFE:Out"  input = "mixR:In 8" }
                ]
                # One graph input per sink channel, in audio.position order.
                inputs  = [ "spFL:In" "spFR:In" "spFC:In" "cpLFE:In" "spRL:In" "spRR:In" "spSL:In" "spSR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                # The sink games and the router see.
                node.name        = "x20-virtual-surround-71"
                node.description = "X20 headphone surround 7.1 (headphones only)"
                media.class      = Audio/Sink/Internal
                # Marks the sink as virtual (no hardware behind it).
                node.virtual     = true
                # Low priority: never chosen as the default sink automatically.
                priority.session = 50
                audio.channels   = 8
                audio.position   = [ FL FR FC LFE RL RR SL SR ]
            }
            playback.props = {
                # Binaural stereo towards the default (hardware) sink.
                node.name        = "x20-virtual-surround-71.output"
                # Passive: an idle filter does not keep the hardware awake.
                node.passive     = true
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
        }
    }

    # ---------------------------------------------------------------- 51 --
    # 5.1 layout (ITU-R BS.775): FL/FR +-30, FC 0, surrounds +-110.
    # Positions FL FR FC LFE RL RR match PulseAudio's 5.1 map; streams that use
    # SL/SR for 5.1 are remapped onto RL/RR by PipeWire's channel mixer.
    { name = libpipewire-module-filter-chain
        # nofail: a missing HRTF file or sofa plugin must not stop PipeWire;
        # the sink is simply absent and the router falls back to the
        # hardware sink.
        flags = [ nofail ]
        args = {
            node.description = "X20 headphone surround 5.1 (headphones only)"
            media.name       = "X20 headphone surround 5.1 (headphones only)"
            filter.graph = {
                nodes = [
                    # FL at azimuth 30 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spFL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 30.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # FR at azimuth 330 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spFR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 330.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # FC at azimuth 0 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spFC
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 0.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # LFE carries no direction: it bypasses the HRTF and is
                    # fed to both ears (see the mixer gains below).
                    { type = builtin label = copy name = cpLFE }
                    # RL at azimuth 110 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spRL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 110.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # RR at azimuth 250 deg (PipeWire: counter-clockwise, 90 = left)
                    {
                        type = sofa label = spatializer name = spRR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            # Per-file headroom; 8 summed sources need it.
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 250.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # Sum every rendered source into the left and right ear.
                    # The builtin mixer has 8 inputs; In N follows the order
                    # of the links below. LFE (last input) at -6 dB.
                    { type = builtin label = mixer name = mixL
                        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 0.5 } }
                    { type = builtin label = mixer name = mixR
                        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 0.5 } }
                ]
                links = [
                    { output = "spFL:Out L" input = "mixL:In 1" }
                    { output = "spFL:Out R" input = "mixR:In 1" }
                    { output = "spFR:Out L" input = "mixL:In 2" }
                    { output = "spFR:Out R" input = "mixR:In 2" }
                    { output = "spFC:Out L" input = "mixL:In 3" }
                    { output = "spFC:Out R" input = "mixR:In 3" }
                    { output = "spRL:Out L" input = "mixL:In 4" }
                    { output = "spRL:Out R" input = "mixR:In 4" }
                    { output = "spRR:Out L" input = "mixL:In 5" }
                    { output = "spRR:Out R" input = "mixR:In 5" }
                    { output = "cpLFE:Out"  input = "mixL:In 6" }
                    { output = "cpLFE:Out"  input = "mixR:In 6" }
                ]
                # One graph input per sink channel, in audio.position order.
                inputs  = [ "spFL:In" "spFR:In" "spFC:In" "cpLFE:In" "spRL:In" "spRR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                # The sink games and the router see.
                node.name        = "x20-virtual-surround-51"
                node.description = "X20 headphone surround 5.1 (headphones only)"
                media.class      = Audio/Sink/Internal
                # Marks the sink as virtual (no hardware behind it).
                node.virtual     = true
                # Low priority: never chosen as the default sink automatically.
                priority.session = 50
                audio.channels   = 6
                audio.position   = [ FL FR FC LFE RL RR ]
            }
            playback.props = {
                # Binaural stereo towards the default (hardware) sink.
                node.name        = "x20-virtual-surround-51.output"
                # Passive: an idle filter does not keep the hardware awake.
                node.passive     = true
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
        }
    }
]
