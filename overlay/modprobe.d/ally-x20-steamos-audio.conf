# Installed by ally-x20-steamos (audio component); recorded in its manifest.
#
# The TAS2783 amp driver requests "1954-0-0x8.bin" and "1954-0-0xB.bin"
# (PCI subsystem id, SoundWire link, unique id). linux-firmware ships those
# tunings as ti/audio/tas2783/1954-<speaker id>-0-0x{8,B}.bin, so stock
# /usr/lib/firmware never has the requested names. The audio component
# installs them under /etc/ally-x20-steamos/firmware; this hook points the
# firmware loader's extra search path there right before the amp driver loads.
# It never overrides a path someone else set (for example
# firmware_class.path= on the kernel command line, which takes precedence).
install snd_soc_tas2783_sdw /bin/sh -c 'p=/sys/module/firmware_class/parameters/path; if [ -w "$p" ] && [ -z "$(cat "$p")" ]; then printf %s /etc/ally-x20-steamos/firmware >"$p"; fi; exec /sbin/modprobe --ignore-install snd_soc_tas2783_sdw $CMDLINE_OPTS'
