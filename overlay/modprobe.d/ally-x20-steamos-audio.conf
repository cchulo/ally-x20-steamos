# Installed by ally-x20-steamos (audio component); recorded in its manifest.
#
# The TAS2783 amp driver requests its tuning firmware ("1954-0-0x8.bin",
# "1954-0-0xB.bin") at probe time. The kernel finds it under
# /etc/ally-x20-steamos/firmware because:
#   - the boot entry carries firmware_class.path=/etc/ally-x20-steamos/firmware
#     (lib/slots.sh, requested by the audio component), and
#   - `apply` writes the same value to /sys/module/firmware_class/parameters/path
#     on a live system when it is still empty.
#
# This file intentionally defines NO `install` line. Module substitution for
# snd-soc-tas2783-sdw (and every other patched module) is owned by
# ally-x20-steamos-modules.conf, generated from patches/kernel/modules*.list.
# Measured on the X20: a second `install snd_soc_tas2783_sdw ...` line here
# that ended in `modprobe --ignore-install` won over the modules hook and the
# STOCK codec module was loaded, silently disabling patches 0004-0006.
