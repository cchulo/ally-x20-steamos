# SPDX-License-Identifier: GPL-2.0-only
# ally-x20-steamos: built-in speaker chain (X20-STEAMOS-PLAN.md section 1.5, item 4).
#
# Installed by the audio_dsp component into
#   ~/.config/pipewire/pipewire.conf.d/51-x20-speaker-chain.conf
# Sink "x20-speakers": picked by WirePlumber's automatic default (its
# priority, below) or by hand in Steam. Streams follow the default sink;
# nothing routes them here per stream. The output goes to the hardware
# speaker sink by name (playback.props below). HRTF is never sent to the
# speakers: both ears hear both speakers (inter-aural crosstalk), which
# destroys the binaural cues. A crosstalk-cancelled speaker virtual surround
# was tried and removed in 2026-10 because it sounded muffled
# (docs/xtc-notes.md).
#
# Only builtin filter-graph nodes are used (mixer, copy, invert, bq_*), all of
# which exist since PipeWire 1.0, so this works on any SteamOS PipeWire. When
# LSP plugins are installed (LV2), the component installs the variant
# 51-x20-speaker-chain-lsp.conf under this same name instead, which appends a
# limiter. TODO(hw): SteamOS 3.9 ships no general-purpose LV2/LADSPA plugins
# (only Valve's Steam Deck tuning in steamdeck-dsp); confirm with
# `ls /usr/lib/lv2 /usr/lib/ladspa` on the X20.
#
# Signal flow per side:
#   7.1 in -> downmix (mixer) -> width (mid/side via mixer + invert)
#          -> high-pass -> low shelf -> presence dip -> high shelf
#          -> master gain -> out
#
# Rendered at install time: the LFE, master gain and priority tokens get
# the audio-dsp.conf settings (lfe_cutoff_hz, lfe_gain_db,
# speakers_master_gain_db, speakers_precedence). Rendered with: @X20_GAIN_SUMMARY@
#
# EQ PRESET: "tuned by ear" placeholder. These values are a starting point
# for small handheld speakers, not a measurement. They will be replaced after
# comparing against the Windows reference recording of the X20 (plan section
# 7). TODO(hw): tune on the device.

context.modules = [
    { name = libpipewire-module-filter-chain
        # nofail: if this graph fails to load, PipeWire keeps running and
        # the automatic default is the hardware sink.
        flags = [ nofail ]
        args = {
            node.description = "X20 Speakers (downmix + width + EQ)"
            media.name       = "X20 Speakers (downmix + width + EQ)"
            filter.graph = {
                nodes = [
                    # --- 1. Surround -> stereo downmix ------------------------
                    # FC feeds both sides through a copy node (one output may
                    # be linked to several inputs); so does the LFE low-pass.
                    { type = builtin label = copy name = cpFC }
                    # LFE: two cascaded 2nd-order low-passes (24 dB/oct, -6 dB at the cutoff, lfe_cutoff_hz). The micro speakers cannot reproduce < 80 Hz: this mostly keeps LFE from wasting headroom.
                    { type = builtin label = bq_lowpass name = lfeLP1
                        control = { "Freq" = @X20_LFE_CUTOFF@ "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = lfeLP2
                        control = { "Freq" = @X20_LFE_CUTOFF@ "Q" = 0.707 } }
                    # ITU-style coefficients: front 1.0, centre and surrounds
                    # -3 dB (0.707), LFE lfe_gain_db (-6 dB). Stereo content only uses
                    # In 1, so stereo passes at unity gain.
                    # In 1 = front, 2 = FC, 3 = side, 4 = rear, 5 = LFE.
                    { type = builtin label = mixer name = dmL
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.707
                            "Gain 3" = 0.707
                            "Gain 4" = 0.707
                            "Gain 5" = @X20_LFE_GAIN@
                        }
                    }
                    { type = builtin label = mixer name = dmR
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.707
                            "Gain 3" = 0.707
                            "Gain 4" = 0.707
                            "Gain 5" = @X20_LFE_GAIN@
                        }
                    }

                    # --- 2. Stereo width (pure builtin mid/side) ---------------
                    # With M = (L+R)/2, S = (L-R)/2 and width w:
                    #   L' = M + w*S = (1+w)/2 * L - (w-1)/2 * R
                    #   R' = M - w*S = (1+w)/2 * R - (w-1)/2 * L
                    # The builtin mixer only takes gains >= 0, so the negative
                    # term goes through an invert node. w = 1.4 here:
                    #   (1+w)/2 = 1.2, (w-1)/2 = 0.2
                    # then x 0.708 (-3 dB) headroom for the EQ boosts below:
                    #   0.85 and 0.142. w = 1.0 (0.708 / 0.0) disables widening.
                    { type = builtin label = invert name = invL }
                    { type = builtin label = invert name = invR }
                    { type = builtin label = mixer name = wL
                        control = { "Gain 1" = 0.85 "Gain 2" = 0.142 }
                    }
                    { type = builtin label = mixer name = wR
                        control = { "Gain 1" = 0.85 "Gain 2" = 0.142 }
                    }

                    # --- 3. EQ (placeholder, tuned by ear) --------------------
                    # High-pass: keep energy the micro speakers cannot
                    # reproduce out of them (less distortion, more loudness).
                    { type = builtin label = bq_highpass name = hpL
                        control = { "Freq" = 150.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = hpR
                        control = { "Freq" = 150.0 "Q" = 0.707 } }
                    # Low shelf just above the cut-off: perceived bass.
                    { type = builtin label = bq_lowshelf name = lsL
                        control = { "Freq" = 250.0 "Q" = 0.707 "Gain" = 3.0 } }
                    { type = builtin label = bq_lowshelf name = lsR
                        control = { "Freq" = 250.0 "Q" = 0.707 "Gain" = 3.0 } }
                    # Small dip in the harsh presence region.
                    { type = builtin label = bq_peaking name = pkL
                        control = { "Freq" = 3500.0 "Q" = 1.0 "Gain" = -2.0 } }
                    { type = builtin label = bq_peaking name = pkR
                        control = { "Freq" = 3500.0 "Q" = 1.0 "Gain" = -2.0 } }
                    # Air.
                    { type = builtin label = bq_highshelf name = hsL
                        control = { "Freq" = 8000.0 "Q" = 0.707 "Gain" = 2.0 } }
                    { type = builtin label = bq_highshelf name = hsR
                        control = { "Freq" = 8000.0 "Q" = 0.707 "Gain" = 2.0 } }

                    # --- Master gain (speakers_master_gain_db) -------------
                    # No builtin limiter exists, so the gain structure is the
                    # clipping protection. Default unity: stereo keeps its
                    # level (see docs/audio-dsp.md, "Headroom").
                    { type = builtin label = mixer name = mgL
                        control = { "Gain 1" = @X20_SPK_MASTER@ } }
                    { type = builtin label = mixer name = mgR
                        control = { "Gain 1" = @X20_SPK_MASTER@ } }
                ]
                links = [
                    # downmix fan-out
                    { output = "cpFC:Out"  input = "dmL:In 2" }
                    { output = "cpFC:Out"  input = "dmR:In 2" }
                    { output = "lfeLP1:Out" input = "lfeLP2:In" }
                    { output = "lfeLP2:Out" input = "dmL:In 5" }
                    { output = "lfeLP2:Out" input = "dmR:In 5" }
                    # width: direct term and inverted cross term
                    { output = "dmL:Out"  input = "wL:In 1" }
                    { output = "dmL:Out"  input = "invL:In" }
                    { output = "dmR:Out"  input = "wR:In 1" }
                    { output = "dmR:Out"  input = "invR:In" }
                    { output = "invR:Out" input = "wL:In 2" }
                    { output = "invL:Out" input = "wR:In 2" }
                    # EQ chain
                    { output = "wL:Out"  input = "hpL:In" }
                    { output = "hpL:Out" input = "lsL:In" }
                    { output = "lsL:Out" input = "pkL:In" }
                    { output = "pkL:Out" input = "hsL:In" }
                    { output = "wR:Out"  input = "hpR:In" }
                    { output = "hpR:Out" input = "lsR:In" }
                    { output = "lsR:Out" input = "pkR:In" }
                    { output = "pkR:Out" input = "hsR:In" }
                    { output = "hsL:Out" input = "mgL:In 1" }
                    { output = "hsR:Out" input = "mgR:In 1" }
                ]
                # One graph input per sink channel, in audio.position order:
                # FL FR FC LFE RL RR SL SR
                inputs  = [ "dmL:In 1" "dmR:In 1" "cpFC:In" "lfeLP1:In"
                            "dmL:In 4" "dmR:In 4" "dmL:In 3" "dmR:In 3" ]
                outputs = [ "mgL:Out" "mgR:Out" ]
            }
            capture.props = {
                node.name        = "x20-speakers"
                node.description = "X20 Speakers (downmix + width + EQ)"
                media.class      = Audio/Sink
                node.virtual     = true
                # Rendered from the speakers_precedence setting: 750 by
                # default, above the hardware Speaker sink (712) and below the
                # jack (1000) and USB/Bluetooth headsets (>= 1000), so
                # WirePlumber's automatic default plays through this sink and
                # hands over to headphones while they are available. 50 with
                # speakers-precedence off (manual pick only).
                priority.session = @X20_SPK_PRIORITY@
                priority.driver  = @X20_SPK_PRIORITY@
                # 7.1 input so surround streams keep all channels until the
                # downmix above; stereo streams only fill FL/FR (no upmix).
                audio.channels   = 8
                audio.position   = [ FL FR FC LFE RL RR SL SR ]
            }
            playback.props = {
                node.name        = "x20-speakers.output"
                # Pinned to the hardware speaker sink. Without a target the
                # output followed the default sink; with x20-speakers itself
                # as the default, WirePlumber fell back to the non-x20 sink
                # with the highest priority.session, which on the X20 is the
                # headphone jack sink (1000 vs 712), even with nothing
                # plugged in (route "[Out] Headphones" not available):
                # silence. The name: alsa_output.<PCI path of the ACP, the
                # AMD audio coprocessor of this SoC, 0000:64:00.5>-platform-
                # amd_sdw.<UCM profile HiFi>__<UCM device Speaker>__sink, as
                # PipeWire's ACP names nodes of the UCM HiFi verb (measured
                # on the X20, SteamOS 3.9.5).
                target.object    = "alsa_output.pci-0000_64_00.5-platform-amd_sdw.HiFi__Speaker__sink"
                # Never fall back to the default sink (which may be this
                # chain or the jack); wait unlinked until the speaker sink
                # exists. linger: WirePlumber would otherwise destroy the
                # stream when the target is missing (find-defined-target).
                node.dont-fallback = true
                node.linger      = true
                node.passive     = true
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
        }
    }
]
