# ally-x20-steamos: copy of upstream
#   rootfs/usr/share/inputplumber/capability_maps/ally_type2.yaml
#   tag v0.83.0, commit 4ed1f50c7801e4f91fd17ce1a7b2b9d8d8b82e69, git blob 9ab261dde44fcb1e618ee4fb3e08cfd8f5182537
#   https://github.com/ShadowBlip/InputPlumber/blob/v0.83.0/rootfs/usr/share/inputplumber/capability_maps/ally_type2.yaml
# Only `name` and `id` differ from upstream, so the stock `aly2` map (used by
# the stock Xbox Ally profile) is left untouched. Installed only for daemons
# older than 0.82.0, together with 50-rog_xbox_ally_x20.stock.yaml.

# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CapabilityMap

# Name for the device event map
name: Ally Type 2 (ally-x20-steamos copy of upstream v0.83.0)

# Unique identifier of the capability mapping
id: ally_x20_steamos_aly2

# List of mapped events that are activated by a specific set of activation keys.
mapping:
  - name: Armoury Crate (Left Short)
    source_events:
      - keyboard: KeyF16
    target_event:
      gamepad:
        button: Keyboard
  - name: Armoury Crate (Left Long)
    source_events:
      - keyboard: KeyF21
    target_event:
      gamepad:
        button: LeftPaddle2
  - name: Library (Right Short)
    source_events:
      - keyboard: KeyProg1
    target_event:
      gamepad:
        button: QuickAccess
  - name: Library (Right Long)
    source_events:
      - keyboard: KeyF22
    target_event:
      gamepad:
        button: QuickAccess2
  - name: Left Paddle
    source_events:
      - keyboard: KeyF14
    target_event:
      gamepad:
        button: LeftPaddle1
  - name: Right Paddle
    source_events:
      - keyboard: KeyF15
    target_event:
      gamepad:
        button: RightPaddle1

# List of events to filter from the source devices
filtered_events: []
