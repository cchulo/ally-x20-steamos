# SPDX-License-Identifier: GPL-2.0-only
# ally-x20-steamos: virtual surround for the built-in speakers.
#
# Installed by the audio_dsp component into
#   ~/.config/pipewire/pipewire.conf.d/52-x20-speaker-surround.conf
# The repository copy is a template. At install time (`audio-dsp apply`,
# `audio-dsp xtc set`) the component replaces these tokens (each written
# between two "@" signs in the body below):
#   X20_HRTF_FILE     absolute path of ~/.config/ally-x20-steamos/hrtf/current.sofa
#   X20_XTC_DELAY_S   crosstalk delay per tap in seconds (xtc_delay_us)
#   X20_XTC_G1..G4    tap gains g^k, g = 10^(-xtc_attenuation_db/20); taps
#                     beyond xtc_taps get 0 (the nodes stay, they are muted)
#   X20_XTC_SUMMARY   the settings, for humans reading the rendered file
# Settings live in ~/.config/ally-x20-steamos/audio-dsp.conf. The derivation
# of the default numbers is in docs/xtc-notes.md.
#
# Sink "x20-speakers-surround" is the open counterpart of "Dolby Atmos for
# built-in speakers": the WirePlumber router sends surround streams here when
# no headphones are connected (setting x20.speaker_surround, default on).
#
#   7.1 in -> 1. binaural render (sofa HRTF, same 7.1 angles as the
#               headphone sink x20-virtual-surround-71)
#          -> 2. crosstalk cancellation (finite RACE network, 300 Hz - 5 kHz)
#          -> 3. + LFE to both channels (no XTC)
#          -> x20-speakers (its width + EQ stage; stereo passes its downmix
#             at unity), so the speaker EQ exists exactly once.
#
# Stage 2, RACE (Recursive Ambiophonic Crosstalk Eliminator, R. Glasgal):
#   L' = L - g * D(R'),  R' = R - g * D(L')        D = delay by tau
# Filter graphs must be acyclic, so the recursion is expanded to 4 taps:
#   L' = L - g D R + g^2 D^2 L - g^3 D^3 R + g^4 D^4 L
#   R' = R - g D L + g^2 D^2 R - g^3 D^3 L + g^4 D^4 R
# Each ear's crosstalk (the far speaker, tau later and g quieter) is
# cancelled by the first tap, the cancellation's own crosstalk by the second,
# and so on. The taps only see a band-passed copy (high-pass 300 Hz, low-pass
# 5 kHz): below 300 Hz the micro speakers cannot deliver the boost an XTC
# needs, above 5 kHz the head already separates the ears and a fixed
# canceller only adds colouration. Bass and highs pass straight through.
#
# The builtin delay works in whole samples (it truncates delay * rate), so the
# component renders tau as (n + 0.5) samples at 48 kHz: n = round(us * 0.048).
# The builtin mixer only takes gains >= 0: odd (negative) taps go through
# invert nodes.
#
# Media class "Audio/Sink/Internal": pipewire-pulse lists only nodes whose
# class is exactly "Audio/Sink", so this sink never shows up in KDE, Steam or
# pavucontrol device pickers (it is routing-only). WirePlumber still creates
# a linkable item for it and the router targets it by name. Side effect:
# pulse clients see a stream on this sink with no sink of its own ("unknown"
# device in pavucontrol). `pw-play --target x20-speakers-surround` works.
#
# Requirements: the sofa plugin (libmysofa), like the headphone sinks. If it
# fails to load (nofail) the router falls back to x20-speakers.
#
# Rendered with: @X20_XTC_SUMMARY@

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "X20 speaker surround (routing only)"
            media.name       = "X20 speaker surround (routing only)"
            filter.graph = {
                nodes = [
                    # --- 1. Binaural render: 7.1 angles, counter-clockwise,
                    # 90 = left (see 50-x20-virtual-surround.conf). gain 0.5
                    # per source: headroom for 7 summed sources.
                    {
                        type = sofa label = spatializer name = spFL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 30.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    {
                        type = sofa label = spatializer name = spFR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 330.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    {
                        type = sofa label = spatializer name = spFC
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 0.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    {
                        type = sofa label = spatializer name = spRL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 150.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    {
                        type = sofa label = spatializer name = spRR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 210.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    {
                        type = sofa label = spatializer name = spSL
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 90.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    {
                        type = sofa label = spatializer name = spSR
                        config = {
                            filename = "@X20_HRTF_FILE@"
                            gain = 0.5
                        }
                        control = {
                            "Azimuth"   = 270.0
                            "Elevation" = 0.0
                            "Radius"    = 1.0
                        }
                    }
                    # LFE has no direction and must not be cancelled.
                    { type = builtin label = copy name = cpLFE }
                    { type = builtin label = mixer name = binL
                        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 1.0 "Gain 7" = 1.0 } }
                    { type = builtin label = mixer name = binR
                        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 1.0 "Gain 7" = 1.0 } }

                    # --- 2. Crosstalk cancellation ------------------------
                    # Band-limit the copy that feeds the taps.
                    { type = builtin label = bq_highpass name = xhpL
                        control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = xhpR
                        control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = xlpL
                        control = { "Freq" = 5000.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = xlpR
                        control = { "Freq" = 5000.0 "Q" = 0.707 } }
                    # Delay lines: dL<k> = left band copy delayed k * tau.
                    { type = builtin label = delay name = dL1
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    { type = builtin label = delay name = dL2
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    { type = builtin label = delay name = dL3
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    { type = builtin label = delay name = dL4
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    { type = builtin label = delay name = dR1
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    { type = builtin label = delay name = dR2
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    { type = builtin label = delay name = dR3
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    { type = builtin label = delay name = dR4
                        config = { "max-delay" = 0.002 }
                        control = { "Delay (s)" = @X20_XTC_DELAY_S@ } }
                    # Odd taps are negative.
                    { type = builtin label = invert name = ivL1 }
                    { type = builtin label = invert name = ivL3 }
                    { type = builtin label = invert name = ivR1 }
                    { type = builtin label = invert name = ivR3 }

                    # --- 2+3. Output sums --------------------------------
                    # In 1 direct (full band), In 2..5 taps 1..4, In 6 LFE
                    # at -6 dB (as in the headphone sinks).
                    { type = builtin label = mixer name = xoL
                        control = { "Gain 1" = 1.0 "Gain 2" = @X20_XTC_G1@ "Gain 3" = @X20_XTC_G2@ "Gain 4" = @X20_XTC_G3@ "Gain 5" = @X20_XTC_G4@ "Gain 6" = 0.5 } }
                    { type = builtin label = mixer name = xoR
                        control = { "Gain 1" = 1.0 "Gain 2" = @X20_XTC_G1@ "Gain 3" = @X20_XTC_G2@ "Gain 4" = @X20_XTC_G3@ "Gain 5" = @X20_XTC_G4@ "Gain 6" = 0.5 } }
                ]
                links = [
                    # binaural sums
                    { output = "spFL:Out L" input = "binL:In 1" }
                    { output = "spFL:Out R" input = "binR:In 1" }
                    { output = "spFR:Out L" input = "binL:In 2" }
                    { output = "spFR:Out R" input = "binR:In 2" }
                    { output = "spFC:Out L" input = "binL:In 3" }
                    { output = "spFC:Out R" input = "binR:In 3" }
                    { output = "spRL:Out L" input = "binL:In 4" }
                    { output = "spRL:Out R" input = "binR:In 4" }
                    { output = "spRR:Out L" input = "binL:In 5" }
                    { output = "spRR:Out R" input = "binR:In 5" }
                    { output = "spSL:Out L" input = "binL:In 6" }
                    { output = "spSL:Out R" input = "binR:In 6" }
                    { output = "spSR:Out L" input = "binL:In 7" }
                    { output = "spSR:Out R" input = "binR:In 7" }
                    # direct paths
                    { output = "binL:Out" input = "xoL:In 1" }
                    { output = "binR:Out" input = "xoR:In 1" }
                    # band-limited copies into the delay lines
                    { output = "binL:Out" input = "xhpL:In" }
                    { output = "xhpL:Out" input = "xlpL:In" }
                    { output = "xlpL:Out" input = "dL1:In" }
                    { output = "dL1:Out"  input = "dL2:In" }
                    { output = "dL2:Out"  input = "dL3:In" }
                    { output = "dL3:Out"  input = "dL4:In" }
                    { output = "binR:Out" input = "xhpR:In" }
                    { output = "xhpR:Out" input = "xlpR:In" }
                    { output = "xlpR:Out" input = "dR1:In" }
                    { output = "dR1:Out"  input = "dR2:In" }
                    { output = "dR2:Out"  input = "dR3:In" }
                    { output = "dR3:Out"  input = "dR4:In" }
                    # taps into the left output: -g D R, +g^2 D^2 L, -g^3 D^3 R, +g^4 D^4 L
                    { output = "dR1:Out"  input = "ivR1:In" }
                    { output = "ivR1:Out" input = "xoL:In 2" }
                    { output = "dL2:Out"  input = "xoL:In 3" }
                    { output = "dR3:Out"  input = "ivR3:In" }
                    { output = "ivR3:Out" input = "xoL:In 4" }
                    { output = "dL4:Out"  input = "xoL:In 5" }
                    # taps into the right output (mirror image)
                    { output = "dL1:Out"  input = "ivL1:In" }
                    { output = "ivL1:Out" input = "xoR:In 2" }
                    { output = "dR2:Out"  input = "xoR:In 3" }
                    { output = "dL3:Out"  input = "ivL3:In" }
                    { output = "ivL3:Out" input = "xoR:In 4" }
                    { output = "dR4:Out"  input = "xoR:In 5" }
                    # LFE to both sides, after the canceller
                    { output = "cpLFE:Out" input = "xoL:In 6" }
                    { output = "cpLFE:Out" input = "xoR:In 6" }
                ]
                # One graph input per sink channel, in audio.position order.
                inputs  = [ "spFL:In" "spFR:In" "spFC:In" "cpLFE:In" "spRL:In" "spRR:In" "spSL:In" "spSR:In" ]
                outputs = [ "xoL:Out" "xoR:Out" ]
            }
            capture.props = {
                node.name        = "x20-speakers-surround"
                node.description = "X20 speaker surround (routing only)"
                # Hidden from pulse device pickers, see the header.
                media.class      = Audio/Sink
                node.virtual     = true
                priority.session = 50
                # 7.1 like x20-virtual-surround-71. 5.1 streams fill RL/RR
                # (rendered at +-150 deg); stereo fills FL/FR only (no upmix).
                audio.channels   = 8
                audio.position   = [ FL FR FC LFE RL RR SL SR ]
            }
            playback.props = {
                node.name        = "x20-speakers-surround.output"
                # Into the speaker chain's width + EQ stage (not the
                # hardware): one EQ, shared with the plain speaker path.
                target.object    = "x20-speakers"
                node.passive     = true
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
        }
    }
]
