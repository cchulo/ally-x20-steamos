# SPDX-License-Identifier: GPL-2.0-only
# ally-x20-steamos: HRTF (SOFA) sets for the headphone virtual surround.
#
# The .sofa files are never committed (see LICENSE.md and .gitignore); they
# are downloaded by fetch-hrtf.sh at install time into
# ~/.config/ally-x20-steamos/hrtf/<name>.sofa and verified against the
# SHA-256 below. Licenses are recorded per set (also listed in LICENSE.md).
#
# Line formats (whitespace separated, one record per line):
#   default <name>
#   set <name> <sha256> <size-bytes> <license> <url>
#   attribution <name> <free text...>
#
# Why mit-kemar is the default: KEMAR is a mannequin built to average adult
# anthropometry, so it is the most neutral non-individualised choice; it is
# the reference set most binaural renderers ship (OpenAL Soft, PipeWire's own
# examples); its terms put no restriction on use; and it is the smallest file.
# Users with a better match to their own ears can switch:
#   ally-x20-steamos audio-dsp hrtf list | hrtf <name>

default mit-kemar

set mit-kemar e7035994f5fd754058424c061380ee92b1d5ed58fccef2887a4266916616acdf 1171764 LicenseRef-MIT-KEMAR https://sofacoustics.org/data/database/mit/mit_kemar_normal_pinna.sofa
attribution mit-kemar MIT Media Lab KEMAR HRTF measurements (normal pinna), B. Gardner and K. Martin, "HRTF Measurements of a KEMAR", J. Acoust. Soc. Am. 97(6), 1995. "Provided without any usage restrictions; please cite Gardner and Martin (1995)." SOFA conversion by ARI (sofacoustics.org).

set hutubs-pp1 f626d335c590db687608fff5992972725230d594067b2e6906893bddc85e5173 1659720 CC-BY-4.0 https://sofacoustics.org/data/database/hutubs/pp1_HRIRs_measured.sofa
attribution hutubs-pp1 HUTUBS head-related transfer function database, subject pp1 (measured), Audio Communication Group, TU Berlin; HUAWEI Munich Research Center; Sennheiser. F. Brinkmann et al., "A cross-evaluated database of measured and simulated HRTFs including 3D head meshes, anthropometric features, and headphone impulse responses", J. Audio Eng. Soc. 67(9), 2019. Licensed CC BY 4.0.

set cipic-003 a9db5f938ed1113b118dcbeb43f5fe1b27b9e191d1bbdb63fbc4803b6959b220 1837391 LicenseRef-CIPIC https://sofacoustics.org/data/database/cipic/subject_003.sofa
attribution cipic-003 CIPIC HRTF Database, subject 003, Copyright (c) 2001 The Regents of the University of California, CIPIC Interface Laboratory (V. R. Algazi, R. O. Duda, D. M. Thompson, C. Avendano, "The CIPIC HRTF Database", IEEE WASPAA 2001). Use for any purpose permitted; reproductions must keep the copyright notice.
