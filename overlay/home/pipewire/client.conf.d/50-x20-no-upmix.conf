# ally-x20-steamos: never synthesise extra channels for native PipeWire clients.
#
# Installed into ~/.config/pipewire/client.conf.d/ by the audio_dsp
# component (X20-STEAMOS-PLAN.md section 1.5, item 2). Native clients (pw-play,
# SDL3 and other libpipewire users, the pipewire-alsa plugin) read client.conf
# and merge this object into the properties of every stream they create.
# Older PipeWire releases loaded client-rt.conf for ALSA clients; current ones
# read client.conf. TODO(vm): confirm the ALSA plugin picks this up on 1.6.
#
# channelmix.upmix = false
#   When a stream has fewer channels than the sink it is linked to, PipeWire's
#   channel mixer would otherwise fill the extra channels (stereo -> centre,
#   LFE, surrounds; 5.1 rears copied to 7.1 sides). Before the virtual-surround
#   renderer that would turn a stereo stream into a fake 7.1 one. With upmix
#   off, a stereo stream on a 7.1 sink only drives FL/FR, and downmixing
#   (more channels -> fewer) still works as before.
#
# channelmix.upmix-method (not set here; only used when upmix is true)
#   none   no upmixing at all
#   simple duplicate front channels into the rear/side channels
#   psd    passive surround decoding: rears get the out-of-phase part
#          (the PipeWire default)
#   To experiment, add e.g. `channelmix.upmix-method = psd` and set upmix to
#   true in a later-sorting fragment of your own.

stream.properties = {
    channelmix.upmix = false
}
