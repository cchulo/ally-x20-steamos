# Installed by ally-x20-steamos (audio component); recorded in its manifest.
#
# Point alsa-lib's UCM lookups at our overlay. ALSA_CONFIG_UCM2 replaces the
# UCM directory (it does not layer), so the overlay contains a symlink to every
# stock entry of /usr/share/alsa/ucm2 plus the TAS2783 speaker profile.
# systemd's user manager reads environment.d, so PipeWire and WirePlumber
# (both `systemd --user` services on SteamOS) see this on the next login.
ALSA_CONFIG_UCM2=/var/lib/ally-x20-steamos/ucm2
