# TAS2783 amplifier tuning files for the ROG Xbox Ally X20 (PCI SSID 1043:1954).
# Parsed by firmware/fetch-tas2783.sh. Blank lines and '#' comments are ignored.
#
#   commit  <linux-firmware commit the files are pinned to>
#   url     <primary URL template>   (%PATH% and %COMMIT% are substituted)
#   mirror  <fallback URL template>  (may repeat; tried in order)
#   file    <supplier> <path in linux-firmware> <name the driver requests> <sha256>
#
# The driver (sound/soc/codecs/tas2783-sdw.c, tas_generate_fw_name) requests
# "%04X-%1X-0x%1X.bin" = <subsystem device>-<link id>-0x<unique id>, with a
# fallback without the "0x". linux-firmware adds the speaker supplier digit
# (from the SPEAKER_ID UEFI variable) in the middle, so both suppliers map to
# the same requested names; see firmware/README.md.
